[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tak-secretary"
version = "0.1.0"
description = "Google Calendar & Tasks CLI for Tak HQ"
requires-python = ">=3.9"
dependencies = [
  "google-api-python-client>=2.100.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.1.0",
  "python-dateutil>=2.8.2",
  "pyyaml>=6.0",
  "anthropic>=0.25.0",
  "python-dotenv>=1.0.0",
  "playwright>=1.44.0",
]

[project.scripts]
secretary = "secretary.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["secretary*"]
